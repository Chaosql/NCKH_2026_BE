# =============================================================
# NCKH — Build & Deploy to AWS EC2
# =============================================================
# Workflow:
#   1. Build JAR trên GitHub Actions (FREE)
#   2. Build Docker image nhẹ (run-only, ~250MB)
#   3. Push image lên Amazon ECR
#   4. SSH vào EC2 → pull image mới → restart container
# =============================================================

name: Build & Deploy to AWS EC2

on:
  push:
    branches: [main]
  workflow_dispatch: # Cho phép trigger thủ công từ GitHub UI

# Tránh deploy trùng lắp: cancel run cũ nếu có run mới
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: ap-southeast-1
  ECR_REPOSITORY: nckh-be

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20  # Tự hủy nếu treo quá 20 phút

    steps:
      # ── 1. Checkout code ──────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # ── 2. Setup JDK 17 + cache Maven dependencies ───────
      - name: Set up JDK 17
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # ── 3. Build JAR (trên GitHub runner — FREE) ──────────
      - name: Build with Maven
        run: chmod +x mvnw && ./mvnw clean package -DskipTests -B

      # ── 4. Configure AWS credentials ──────────────────────
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.0.2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # ── 5. Login to Amazon ECR ────────────────────────────
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@062b18b96a7aff071d4dc91bc00c4c1a7945b076 # v2.0.1

      # ── 6. Build & Push Docker image (run-only) ───────────
      - name: Build and push Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          echo "Building image with aws.Dockerfile (run-only, no Maven)..."
          docker build -f aws.Dockerfile -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:latest
          echo "Pushing to ECR..."
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          echo "Image pushed: $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

      # ── 7. Deploy to EC2 via SSH ──────────────────────────
      - name: Deploy to EC2
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ env.ECR_REPOSITORY }}
          DB_PASSWORD: ${{ secrets.NCKH_DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.NCKH_JWT_SECRET }}
          MAIL_USERNAME: ${{ secrets.NCKH_MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.NCKH_MAIL_PASSWORD }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.NCKH_CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.NCKH_CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.NCKH_CLOUDINARY_API_SECRET }}
          ADMIN_USERNAME: ${{ secrets.NCKH_ADMIN_USERNAME }}
          ADMIN_PASSWORD: ${{ secrets.NCKH_ADMIN_PASSWORD }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: ECR_REGISTRY,ECR_REPOSITORY,DB_PASSWORD,JWT_SECRET,MAIL_USERNAME,MAIL_PASSWORD,CLOUDINARY_CLOUD_NAME,CLOUDINARY_API_KEY,CLOUDINARY_API_SECRET,ADMIN_USERNAME,ADMIN_PASSWORD,AWS_ACCESS_KEY_ID,AWS_SECRET_ACCESS_KEY
          script: |
            set -e # Dừng script ngay nếu có lệnh lỗi
            echo "Starting NCKH deployment..."

            # Tạo thư mục nếu chưa có
            mkdir -p /home/ec2-user/nckh

            # Ghi các biến môi trường vào file .env
            cat <<EOF > /home/ec2-user/nckh/.env
            DB_URL=jdbc:postgresql://nckh-postgres:5432/NCKH
            DB_USERNAME=postgres
            DB_PASSWORD=$DB_PASSWORD
            JWT_SECRET=$JWT_SECRET
            MAIL_USERNAME=$MAIL_USERNAME
            MAIL_PASSWORD=$MAIL_PASSWORD
            CLOUDINARY_CLOUD_NAME=$CLOUDINARY_CLOUD_NAME
            CLOUDINARY_API_KEY=$CLOUDINARY_API_KEY
            CLOUDINARY_API_SECRET=$CLOUDINARY_API_SECRET
            ADMIN_USERNAME=$ADMIN_USERNAME
            ADMIN_PASSWORD=$ADMIN_PASSWORD
            ADMIN_LAST_NAME=Kien
            ADMIN_FIRST_NAME=Nguyen
            SPRING_DATA_REDIS_HOST=nckh-redis
            EOF

            # Login ECR
            AWS_ACCESS_KEY_ID=$AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY=$AWS_SECRET_ACCESS_KEY aws ecr get-login-password --region ap-southeast-1 | docker login --username AWS --password-stdin $ECR_REGISTRY

            # Tạo Docker network nếu chưa có
            docker network create nckh-network 2>/dev/null || true

            # Khởi động PostgreSQL nếu chưa chạy
            if ! docker ps --format '{{.Names}}' | grep -q '^nckh-postgres$'; then
              echo "Starting nckh-postgres..."
              docker run -d \
                --name nckh-postgres \
                --restart unless-stopped \
                --network nckh-network \
                -e POSTGRES_DB=NCKH \
                -e POSTGRES_USER=postgres \
                -e POSTGRES_PASSWORD=$DB_PASSWORD \
                -v nckh-postgres-data:/var/lib/postgresql/data \
                postgres:15
            fi

            # Khởi động Redis nếu chưa chạy
            if ! docker ps --format '{{.Names}}' | grep -q '^nckh-redis$'; then
              echo "Starting nckh-redis..."
              docker run -d \
                --name nckh-redis \
                --restart unless-stopped \
                --network nckh-network \
                redis:7-alpine
            fi

            # Pull image mới
            docker pull $ECR_REGISTRY/$ECR_REPOSITORY:latest

            # Stop container cũ (nếu có)
            docker stop nckh-be 2>/dev/null || true
            docker rm nckh-be 2>/dev/null || true

            # Start container mới
            docker run -d \
              --name nckh-be \
              --restart unless-stopped \
              --network nckh-network \
              -p 8081:8080 \
              --env-file /home/ec2-user/nckh/.env \
              $ECR_REGISTRY/$ECR_REPOSITORY:latest

            # Dọn image cũ để giải phóng ổ cứng EC2
            docker image prune -f

            echo "NCKH Deployment complete!"
            echo "Container status:"
            docker ps --filter name=nckh
