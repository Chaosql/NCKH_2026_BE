# =============================================================
# NCKH - AWS Profile
# =============================================================
# This profile is activated when running on AWS EC2
# It overrides configurations from application.properties
# =============================================================

# Database - PostgreSQL on Docker
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

# JPA - disable sql logs for production
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.use_sql_comments=false

# Redis - running on Docker
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=6379

# Swagger - enabled for dev/staging, disable for prod
springdoc.api-docs.enabled=${SWAGGER_ENABLED:true}

# Multipart - use /tmp directly (always exists in Linux)
spring.servlet.multipart.location=/tmp

# Logging - reduce for production
logging.level.root=WARN
logging.level.org.hit.NCKH=INFO
logging.level.org.springframework=WARN
logging.level.org.hibernate.SQL=WARN
